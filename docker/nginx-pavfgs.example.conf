# Скопируй в /etc/nginx/sites-available/pavfgs, затем:
#   sudo ln -s /etc/nginx/sites-available/pavfgs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pavfgs.ru -d www.pavfgs.ru -d brush.pavfgs.ru
#
# До certbot: только HTTP :80. Certbot подставит ssl_certificate и listen 443.
#
# Сервисы на хосте (только 127.0.0.1):
#   Streamlit:  127.0.0.1:8501  (см. main_page.py)
#   Brush:      127.0.0.1:8080  (docker brush-web)
#
# export PAVFGS_BRUSH_URL="https://brush.pavfgs.ru"
# streamlit run src/interface/main_page.py --server.address 127.0.0.1 --server.port 8501

# ----- главный сайт: PavFGS (Streamlit) -----
server {
    listen 80;
    listen [::]:80;
    server_name pavfgs.ru www.pavfgs.ru;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

# ----- iframe / WebGPU: Brush -----
server {
    listen 80;
    listen [::]:80;
    server_name brush.pavfgs.ru;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
